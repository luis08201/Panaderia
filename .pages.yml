# Configuración de Pages CMS (https://pagescms.org/docs/configuration/)
# Pages CMS guarda cada cambio como un commit en GitHub. El hosting ejecuta
# `npm run build`, que valida el contenido y genera public-data/ para el sitio.

media:
  - name: productos
    label: Product photos
    input: assets/images/products
    output: assets/images/products
    categories: [image]
    rename: safe
  - name: categorias
    label: Category photos
    input: assets/images/categories
    output: assets/images/categories
    categories: [image]
    rename: safe
  - name: general
    label: General photos
    input: assets/images/general
    output: assets/images/general
    categories: [image]
    rename: safe

content:
  - name: productos
    label: Products
    type: collection
    path: content/products
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [image, name, price, available, published]
      primary: name
      sort: [name, price]
      search: [name, shortDescription]
      default:
        sort: name
        order: asc
    fields:
      - name: id
        label: Internal ID
        type: string
        required: true
        pattern:
          regex: "^prd-[a-z0-9-]+$"
          message: "Usa el formato prd-029. No lo cambies después de crear el producto."
        description: "Identificador estable (prd-029, prd-030…). No depende del nombre."
      - name: slug
        label: Slug (URL)
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: "Solo minúsculas, números y guiones. Ejemplo: pan-de-coco"
        description: "Appears in the product URL: productos/pan-de-coco/"
      - name: name
        label: Name
        type: string
        required: true
      - name: categoryId
        label: Category
        type: reference
        required: true
        options:
          collection: categorias
          value: "{fields.id}"
          label: "{fields.name}"
          search: "fields.name"
      - name: shortDescription
        label: Short description
        type: text
        description: "One short line for product cards."
      - name: description
        label: Description
        type: text
        description: "Leave a blank line between paragraphs."
      - name: price
        label: Price (USD)
        type: number
        description: "Enter USD amounts without a currency symbol. Leave empty to display Price on request."
        options:
          min: 0
      - name: unit
        label: Unit / serving
        type: string
        description: "Example: Each, Pack of 6, Whole cake (serves 12)."
      - name: currency
        label: Currency
        type: select
        default: USD
        options:
          values: [USD]
      - name: image
        label: Main photo
        type: image
        required: true
        options:
          media: productos
      - name: imageAlt
        label: Image alt text
        type: string
        description: "Describe the image for screen readers. Leave blank to use the product name."
      - name: gallery
        label: Gallery
        type: image
        options:
          media: productos
          multiple:
            max: 6
          unique: true
      - name: ingredients
        label: Ingredients
        type: string
        list: true
      - name: allergens
        label: Allergens
        type: string
        list: true
      - name: available
        label: Available today
        type: boolean
        default: true
        description: "Turn off to mark this product as sold out."
      - name: featured
        label: Featured on homepage
        type: boolean
        default: false
      - name: newArrival
        label: New arrival
        type: boolean
        default: false
      - name: published
        label: Published
        type: boolean
        default: true
        description: "Turn off to hide the product without deleting it."
      - name: sortOrder
        label: Sort order
        type: number
        default: 100
        description: "Lower numbers appear first within the category."
      - name: seoTitle
        label: SEO title
        type: string
      - name: seoDescription
        label: SEO description
        type: text

  - name: categorias
    label: Categories
    type: collection
    path: content/categories
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [image, name, position, published]
      primary: name
      default:
        sort: position
        order: asc
    fields:
      - name: id
        label: Internal ID
        type: string
        required: true
        pattern:
          regex: "^cat-[a-z0-9-]+$"
          message: "Usa el formato cat-nombre. No lo cambies: los productos lo usan."
      - name: slug
        label: Slug (URL)
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: "Solo minúsculas, números y guiones."
        description: "Se usa en el filtro: catalogo.html?categoria=pan-dulce"
      - name: name
        label: Name
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: image
        label: Photo
        type: image
        options:
          media: categorias
      - name: position
        label: Position
        type: number
        default: 10
      - name: published
        label: Published
        type: boolean
        default: true

  - name: promociones
    label: Promotions
    type: collection
    path: content/promotions
    format: json
    filename: "{fields.id}.json"
    view:
      fields: [title, startDate, endDate, active]
      primary: title
    fields:
      - name: id
        label: Internal ID
        type: string
        required: true
        pattern:
          regex: "^promo-[a-z0-9-]+$"
          message: "Usa el formato promo-nombre."
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        description: "Solo informativa: el sitio no aplica descuentos."
      - name: image
        label: Image
        type: image
        options:
          media: productos
      - name: startDate
        label: From
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: Until
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
        description: "Se oculta sola al día siguiente."
      - name: active
        label: Active
        type: boolean
        default: true
      - name: linkUrl
        label: Link (optional)
        type: string
        description: "Ejemplo: catalogo.html?categoria=pan-dulce"
      - name: linkLabel
        label: Link label
        type: string

  - name: inicio
    label: Homepage
    type: file
    path: content/pages/home.json
    format: json
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Title, type: string, required: true }
          - { name: text, label: Text, type: text }
          - { name: ctaLabel, label: Button label, type: string }
          - { name: image, label: Image, type: image, options: { media: general } }
          - { name: imageAlt, label: Alt text, type: string }
      - name: categories
        label: Category section
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: featured
        label: Featured products
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: fresh
        label: Freshly baked
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: schedule, label: Baking schedule, type: string }
      - name: promotions
        label: Promotions section
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: story
        label: Short story
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: image, label: Image, type: image, options: { media: general } }
          - { name: imageAlt, label: Alt text, type: string }
          - { name: linkLabel, label: Link label, type: string }
      - name: visit
        label: Visit us
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }

  - name: nosotros
    label: About page
    type: file
    path: content/pages/nosotros.json
    format: json
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Title, type: string, required: true }
          - { name: text, label: Text, type: text }
          - { name: image, label: Image, type: image, options: { media: general } }
          - { name: imageAlt, label: Alt text, type: string }
      - name: story
        label: Historia
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text, description: "Deja una línea en blanco entre párrafos." }
      - name: values
        label: Valores
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: process
        label: Proceso artesanal
        type: object
        list: true
        fields:
          - { name: title, label: Paso, type: string }
          - { name: text, label: Text, type: text }
      - name: gallery
        label: Gallery
        type: object
        list: true
        fields:
          - { name: image, label: Image, type: image, options: { media: general } }
          - { name: alt, label: Alt text, type: string }

  - name: configuracion
    label: Configuración
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: businessName, label: Business name, type: string, required: true }
      - { name: tagline, label: Lema, type: string }
      - name: demoNotice
        label: Mostrar aviso de datos de ejemplo
        type: boolean
        description: "Desactívalo cuando nombre, teléfono y dirección sean los reales."
      - name: announcement
        label: Barra de anuncio
        type: object
        fields:
          - { name: enabled, label: Mostrar, type: boolean }
          - { name: text, label: Text, type: string }
          - { name: linkLabel, label: Link label, type: string }
          - { name: linkUrl, label: Enlace, type: string }
      - name: whatsapp
        label: WhatsApp
        type: string
        description: "Con código de país y sin espacios ni signos. Ejemplo: 50588887777"
        pattern:
          regex: "^[0-9]{8,15}$"
          message: "Solo números, con el código de país (505)."
      - { name: whatsappMessage, label: Default WhatsApp message, type: string }
      - { name: phone, label: Phone, type: string }
      - { name: address, label: Address, type: text }
      - { name: mapsUrl, label: Enlace de Google Maps, type: string }
      - name: hours
        label: Hours
        type: object
        list: true
        fields:
          - { name: days, label: Days, type: string }
          - { name: time, label: Hours, type: string }
      - name: social
        label: Social media
        type: object
        list: true
        description: "Las redes sin enlace no se muestran."
        fields:
          - name: network
            label: Network
            type: select
            options:
              values: [Instagram, Facebook, TikTok, X, YouTube]
          - { name: url, label: Enlace, type: string }
      - { name: availabilityNote, label: Availability note, type: text }
      - name: seo
        label: Global SEO
        type: object
        fields:
          - { name: siteUrl, label: Site domain, type: string, description: "Ejemplo: https://www.mipanaderia.com. Activa canonical y sitemap." }
          - { name: title, label: Default title, type: string }
          - { name: description, label: Default description, type: text }
          - { name: ogImage, label: Social sharing image, type: image, options: { media: general } }
