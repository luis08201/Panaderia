    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: businessName, label: Business name, type: string, required: true }
      - { name: tagline, label: Lema, type: string }
      - name: demoNotice
        label: Mostrar aviso de datos de ejemplo
        type: boolean
        description: "Turn off once the business name, phone, and address are real."
      - name: announcement
        label: Barra de anuncio
        type: object
        fields:
          - { name: enabled, label: Mostrar, type: boolean }
          - { name: text, label: Text, type: string }
          - { name: linkLabel, label: Link label, type: string }
          - { name: linkUrl, label: Enlace, type: string }
      - name: whatsapp
        label: WhatsApp
        type: string
        description: "Include country code; use digits only. Example: 50588887777"
        pattern:
          regex: "^[0-9]{8,15}$"
          message: "Digits only, including the country code."
      - { name: whatsappMessage, label: Default WhatsApp message, type: string }
      - { name: phone, label: Phone, type: string }
      - { name: address, label: Address, type: text }
      - { name: mapsUrl, label: Enlace de Google Maps, type: string }
      - name: hours
        label: Hours
        type: object
        list: true
        fields:
          - { name: days, label: Days, type: string }
          - { name: time, label: Hours, type: string }
      - name: social
        label: Social media
        type: object
        list: true
        description: "Social networks without links are not displayed."
        fields:
          - name: network
            label: Network
            type: select
            options:
              values: [Instagram, Facebook, TikTok, X, YouTube]
          - { name: url, label: Enlace, type: string }
      - { name: availabilityNote, label: Availability note, type: text }
      - name: seo
        label: Global SEO
        type: object
        fields:
          - { name: siteUrl, label: Site domain, type: string, description: "Example: https://www.examplebakery.com. Enables canonical URLs and sitemap." }
          - { name: title, label: Default title, type: string }
          - { name: description, label: Default description, type: text }
          - { name: ogImage, label: Social sharing image, type: image, options: { media: general } }

