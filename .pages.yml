# Pages CMS configuration (https://pagescms.org/docs/configuration/)
# Pages CMS saves each change as a GitHub commit. Hosting runs
# `npm run build` to validate content and generate public-data/ for the site.
# Spanish copy for the ES/EN switch lives in content/locales/es.json, not in these fields.

media:
  - name: blog_images
    label: Blog photos
    input: assets/images/blog
    output: assets/images/blog
    categories: [image]
    rename: safe
  - name: productos
    label: Product photos
    input: assets/images/products
    output: assets/images/products
    categories: [image]
    rename: safe
  - name: categorias
    label: Category photos
    input: assets/images/categories
    output: assets/images/categories
    categories: [image]
    rename: safe
  - name: general
    label: General photos
    input: assets/images/general
    output: assets/images/general
    categories: [image]
    rename: safe

content:
  - name: blog_categories
    label: Blog categories
    type: collection
    operations: { create: false, rename: false, delete: false }
    path: content/blog-categories
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [name, description, position]
      primary: name
      default: { sort: position, order: asc }
    fields:
      - { name: id, label: Internal ID, type: string, required: true, description: "Keep this value unchanged. Articles use it to identify their category." }
      - name: slug
        label: Category address
        type: string
        required: true
        pattern: { regex: "^[a-z0-9]+(-[a-z0-9]+)*$", message: "Use lowercase letters, numbers, and hyphens. Do not use all." }
      - { name: name, label: Category name, type: string, required: true }
      - { name: description, label: Short description, type: text }
      - { name: position, label: Display order, type: number, default: 10, description: "Lower numbers appear first. The blog uses exactly four categories; All is added automatically." }

  - name: blog_posts
    label: Blog posts
    type: collection
    path: content/blog-posts
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [image, title, date, featured, published]
      primary: title
      search: [title, excerpt]
      default: { sort: date, order: desc }
    fields:
      - { name: id, label: Internal ID, type: string, required: true, description: "Use a unique value such as post-013. Keep it unchanged after creating an article." }
      - name: slug
        label: Article address
        type: string
        required: true
        pattern: { regex: "^[a-z0-9]+(-[a-z0-9]+)*$", message: "Use lowercase letters, numbers, and hyphens." }
        description: "Example: a-simple-guide-to-sourdough. Appears in blog/a-simple-guide-to-sourdough/."
      - { name: title, label: Article title, type: string, required: true }
      - { name: excerpt, label: Short preview, type: text, required: true, description: "A short summary for the cards and the top of the article." }
      - name: categoryId
        label: Blog category
        type: reference
        required: true
        options:
          collection: blog_categories
          value: "{fields.id}"
          label: "{fields.name}"
          search: "fields.name"
      - { name: date, label: Publication date, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: author, label: Author name, type: string, required: true }
      - { name: image, label: Cover photo, type: image, required: true, options: { media: blog_images } }
      - { name: imageAlt, label: Photo description, type: string, required: true, description: "Describe what is shown for visitors using a screen reader." }
      - { name: introduction, label: Opening paragraph, type: text, required: true, description: "Start the story here. Use a blank line for a new paragraph." }
      - name: sections
        label: Article sections
        type: object
        list: true
        fields:
          - { name: heading, label: Section title, type: string, required: true }
          - { name: text, label: Section text, type: text, required: true, description: "Use a blank line between paragraphs. Add as many sections as the article needs." }
      - { name: featured, label: Featured article, type: boolean, default: false, description: "Shows in Featured stories. The three newest featured articles are displayed." }
      - { name: published, label: Published, type: boolean, default: false, description: "Turn off to keep the article as a draft. Publication happens when the site is rebuilt." }
      - { name: seoTitle, label: Search result title (optional), type: string }
      - { name: seoDescription, label: Search result description (optional), type: text }

  - name: productos
    label: Products
    type: collection
    path: content/products
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [image, name, price, available, published]
      primary: name
      sort: [name, price]
      search: [name, shortDescription]
      default:
        sort: name
        order: asc
    fields:
      - name: id
        label: Internal ID
        type: string
        required: true
        pattern:
          regex: "^prd-[a-z0-9-]+$"
          message: "Use the format prd-029. Do not change it after creating the product."
        description: "Stable ID (prd-029, prd-030…). Independent of the product name."
      - name: slug
        label: Slug (URL)
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: "Use lowercase letters, numbers, and hyphens only. Example: pan-de-coco"
        description: "Appears in the product URL: productos/pan-de-coco/"
      - name: name
        label: Name
        type: string
        required: true
      - name: categoryId
        label: Category
        type: reference
        required: true
        options:
          collection: categorias
          value: "{fields.id}"
          label: "{fields.name}"
          search: "fields.name"
      - name: shortDescription
        label: Short description
        type: text
        description: "One short line for product cards."
      - name: description
        label: Description
        type: text
        description: "Leave a blank line between paragraphs."
      - name: price
        label: Price (USD)
        type: number
        description: "Enter USD amounts without a currency symbol. Leave empty to display Price on request."
        options:
          min: 0
      - name: unit
        label: Unit / serving
        type: string
        description: "Example: Each, Pack of 6, Whole cake (serves 12)."
      - name: currency
        label: Currency
        type: select
        default: USD
        options:
          values: [USD]
      - name: image
        label: Main photo
        type: image
        required: true
        options:
          media: productos
      - name: imageAlt
        label: Image alt text
        type: string
        description: "Describe the image for screen readers. Leave blank to use the product name."
      - name: gallery
        label: Gallery
        type: image
        options:
          media: productos
          multiple:
            max: 6
          unique: true
      - name: ingredients
        label: Ingredients
        type: string
        list: true
      - name: allergens
        label: Allergens
        type: string
        list: true
      - name: available
        label: Available today
        type: boolean
        default: true
        description: "Turn off to mark this product as sold out."
      - name: featured
        label: Featured on homepage
        type: boolean
        default: false
      - name: newArrival
        label: New arrival
        type: boolean
        default: false
      - name: published
        label: Published
        type: boolean
        default: true
        description: "Turn off to hide the product without deleting it."
      - name: sortOrder
        label: Sort order
        type: number
        default: 100
        description: "Lower numbers appear first within the category."
      - name: seoTitle
        label: SEO title
        type: string
      - name: seoDescription
        label: SEO description
        type: text

  - name: categorias
    label: Categories
    type: collection
    path: content/categories
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [image, name, position, published]
      primary: name
      default:
        sort: position
        order: asc
    fields:
      - name: id
        label: Internal ID
        type: string
        required: true
        pattern:
          regex: "^cat-[a-z0-9-]+$"
          message: "Use cat-name. Do not change it; products reference this ID."
      - name: slug
        label: Slug (URL)
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: "Use lowercase letters, numbers, and hyphens only."
        description: "Used in category filters: catalogo.html?categoria=pan-dulce"
      - name: name
        label: Name
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: image
        label: Photo
        type: image
        options:
          media: categorias
      - name: position
        label: Position
        type: number
        default: 10
      - name: published
        label: Published
        type: boolean
        default: true

  - name: promociones
    label: Promotions
    type: collection
    path: content/promotions
    format: json
    filename: "{fields.id}.json"
    view:
      fields: [title, startDate, endDate, active]
      primary: title
    fields:
      - name: id
        label: Internal ID
        type: string
        required: true
        pattern:
          regex: "^promo-[a-z0-9-]+$"
          message: "Use the format promo-name."
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        description: "For display only; the site does not apply discounts."
      - name: image
        label: Image
        type: image
        options:
          media: productos
      - name: startDate
        label: From
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: Until
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
        description: "Automatically hidden after the end date."
      - name: active
        label: Active
        type: boolean
        default: true
      - name: linkUrl
        label: Link (optional)
        type: string
        description: "Example: catalogo.html?categoria=pan-dulce"
      - name: linkLabel
        label: Link label
        type: string

