# Configuración de Pages CMS (https://pagescms.org/docs/configuration/)
# Pages CMS guarda cada cambio como un commit en GitHub. El hosting ejecuta
# `npm run build`, que valida el contenido y genera public-data/ para el sitio.

media:
  - name: productos
    label: Fotos de productos
    input: assets/images/products
    output: assets/images/products
    categories: [image]
    rename: safe
  - name: categorias
    label: Fotos de categorías
    input: assets/images/categories
    output: assets/images/categories
    categories: [image]
    rename: safe
  - name: general
    label: Fotos generales
    input: assets/images/general
    output: assets/images/general
    categories: [image]
    rename: safe

content:
  - name: productos
    label: Productos
    type: collection
    path: content/products
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [image, name, price, available, published]
      primary: name
      sort: [name, price]
      search: [name, shortDescription]
      default:
        sort: name
        order: asc
    fields:
      - name: id
        label: ID interno
        type: string
        required: true
        pattern:
          regex: "^prd-[a-z0-9-]+$"
          message: "Usa el formato prd-029. No lo cambies después de crear el producto."
        description: "Identificador estable (prd-029, prd-030…). No depende del nombre."
      - name: slug
        label: Slug (URL)
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: "Solo minúsculas, números y guiones. Ejemplo: pan-de-coco"
        description: "Aparece en la dirección: producto.html?slug=pan-de-coco"
      - name: name
        label: Nombre
        type: string
        required: true
      - name: categoryId
        label: Categoría
        type: reference
        required: true
        options:
          collection: categorias
          value: "{fields.id}"
          label: "{fields.name}"
          search: "fields.name"
      - name: shortDescription
        label: Descripción corta
        type: text
        description: "Una línea para las tarjetas del catálogo."
      - name: description
        label: Descripción
        type: text
        description: "Deja una línea en blanco para separar párrafos."
      - name: price
        label: Precio (C$)
        type: number
        description: "En córdobas, sin símbolo. Déjalo vacío para mostrar «Precio a consultar»."
        options:
          min: 0
      - name: unit
        label: Presentación
        type: string
        description: "Ejemplo: Unidad, Bolsa de 6 unidades, Pastel entero de 12 porciones."
      - name: currency
        label: Moneda
        type: select
        default: NIO
        options:
          values: [NIO]
      - name: image
        label: Foto principal
        type: image
        required: true
        options:
          media: productos
      - name: imageAlt
        label: Texto alternativo de la foto
        type: string
        description: "Describe la foto para lectores de pantalla. Si lo dejas vacío se usa el nombre."
      - name: gallery
        label: Galería
        type: image
        options:
          media: productos
          multiple:
            max: 6
          unique: true
      - name: ingredients
        label: Ingredientes
        type: string
        list: true
      - name: allergens
        label: Alérgenos
        type: string
        list: true
      - name: available
        label: Disponible hoy
        type: boolean
        default: true
        description: "Si lo desactivas, el producto se muestra como «Agotado»."
      - name: featured
        label: Destacado en inicio
        type: boolean
        default: false
      - name: newArrival
        label: Novedad
        type: boolean
        default: false
      - name: published
        label: Publicado
        type: boolean
        default: true
        description: "Desactívalo para ocultar el producto sin borrarlo."
      - name: sortOrder
        label: Orden
        type: number
        default: 100
        description: "Menor número aparece primero dentro de su categoría."
      - name: seoTitle
        label: Título SEO
        type: string
      - name: seoDescription
        label: Descripción SEO
        type: text

  - name: categorias
    label: Categorías
    type: collection
    path: content/categories
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [image, name, position, published]
      primary: name
      default:
        sort: position
        order: asc
    fields:
      - name: id
        label: ID interno
        type: string
        required: true
        pattern:
          regex: "^cat-[a-z0-9-]+$"
          message: "Usa el formato cat-nombre. No lo cambies: los productos lo usan."
      - name: slug
        label: Slug (URL)
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: "Solo minúsculas, números y guiones."
        description: "Se usa en el filtro: catalogo.html?categoria=pan-dulce"
      - name: name
        label: Nombre
        type: string
        required: true
      - name: description
        label: Descripción
        type: text
      - name: image
        label: Foto
        type: image
        options:
          media: categorias
      - name: position
        label: Posición
        type: number
        default: 10
      - name: published
        label: Publicada
        type: boolean
        default: true

  - name: promociones
    label: Promociones
    type: collection
    path: content/promotions
    format: json
    filename: "{fields.id}.json"
    view:
      fields: [title, startDate, endDate, active]
      primary: title
    fields:
      - name: id
        label: ID interno
        type: string
        required: true
        pattern:
          regex: "^promo-[a-z0-9-]+$"
          message: "Usa el formato promo-nombre."
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Descripción
        type: text
        description: "Solo informativa: el sitio no aplica descuentos."
      - name: image
        label: Imagen
        type: image
        options:
          media: productos
      - name: startDate
        label: Desde
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: Hasta
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
        description: "Se oculta sola al día siguiente."
      - name: active
        label: Activa
        type: boolean
        default: true
      - name: linkUrl
        label: Enlace (opcional)
        type: string
        description: "Ejemplo: catalogo.html?categoria=pan-dulce"
      - name: linkLabel
        label: Texto del enlace
        type: string

  - name: inicio
    label: Página de inicio
    type: file
    path: content/pages/home.json
    format: json
    fields:
      - name: hero
        label: Portada
        type: object
        fields:
          - { name: eyebrow, label: Antetítulo, type: string }
          - { name: title, label: Título, type: string, required: true }
          - { name: text, label: Texto, type: text }
          - { name: ctaLabel, label: Texto del botón, type: string }
          - { name: image, label: Imagen, type: image, options: { media: general } }
          - { name: imageAlt, label: Texto alternativo, type: string }
      - name: categories
        label: Sección de categorías
        type: object
        fields:
          - { name: title, label: Título, type: string }
          - { name: text, label: Texto, type: text }
      - name: featured
        label: Productos destacados
        type: object
        fields:
          - { name: title, label: Título, type: string }
          - { name: text, label: Texto, type: text }
      - name: fresh
        label: Recién horneados
        type: object
        fields:
          - { name: title, label: Título, type: string }
          - { name: text, label: Texto, type: text }
          - { name: schedule, label: Horario de horneado, type: string }
      - name: promotions
        label: Sección de promociones
        type: object
        fields:
          - { name: title, label: Título, type: string }
          - { name: text, label: Texto, type: text }
      - name: story
        label: Historia breve
        type: object
        fields:
          - { name: eyebrow, label: Antetítulo, type: string }
          - { name: title, label: Título, type: string }
          - { name: text, label: Texto, type: text }
          - { name: image, label: Imagen, type: image, options: { media: general } }
          - { name: imageAlt, label: Texto alternativo, type: string }
          - { name: linkLabel, label: Texto del enlace, type: string }
      - name: visit
        label: Visítanos
        type: object
        fields:
          - { name: title, label: Título, type: string }
          - { name: text, label: Texto, type: text }

  - name: nosotros
    label: Página Nosotros
    type: file
    path: content/pages/nosotros.json
    format: json
    fields:
      - name: hero
        label: Portada
        type: object
        fields:
          - { name: eyebrow, label: Antetítulo, type: string }
          - { name: title, label: Título, type: string, required: true }
          - { name: text, label: Texto, type: text }
          - { name: image, label: Imagen, type: image, options: { media: general } }
          - { name: imageAlt, label: Texto alternativo, type: string }
      - name: story
        label: Historia
        type: object
        fields:
          - { name: title, label: Título, type: string }
          - { name: text, label: Texto, type: text, description: "Deja una línea en blanco entre párrafos." }
      - name: values
        label: Valores
        type: object
        list: true
        fields:
          - { name: title, label: Título, type: string }
          - { name: text, label: Texto, type: text }
      - name: process
        label: Proceso artesanal
        type: object
        list: true
        fields:
          - { name: title, label: Paso, type: string }
          - { name: text, label: Texto, type: text }
      - name: gallery
        label: Galería
        type: object
        list: true
        fields:
          - { name: image, label: Imagen, type: image, options: { media: general } }
          - { name: alt, label: Texto alternativo, type: string }

  - name: configuracion
    label: Configuración
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: businessName, label: Nombre del negocio, type: string, required: true }
      - { name: tagline, label: Lema, type: string }
      - name: demoNotice
        label: Mostrar aviso de datos de ejemplo
        type: boolean
        description: "Desactívalo cuando nombre, teléfono y dirección sean los reales."
      - name: announcement
        label: Barra de anuncio
        type: object
        fields:
          - { name: enabled, label: Mostrar, type: boolean }
          - { name: text, label: Texto, type: string }
          - { name: linkLabel, label: Texto del enlace, type: string }
          - { name: linkUrl, label: Enlace, type: string }
      - name: whatsapp
        label: WhatsApp
        type: string
        description: "Con código de país y sin espacios ni signos. Ejemplo: 50588887777"
        pattern:
          regex: "^[0-9]{8,15}$"
          message: "Solo números, con el código de país (505)."
      - { name: whatsappMessage, label: Mensaje general de WhatsApp, type: string }
      - { name: phone, label: Teléfono, type: string }
      - { name: address, label: Dirección, type: text }
      - { name: mapsUrl, label: Enlace de Google Maps, type: string }
      - name: hours
        label: Horarios
        type: object
        list: true
        fields:
          - { name: days, label: Días, type: string }
          - { name: time, label: Horario, type: string }
      - name: social
        label: Redes sociales
        type: object
        list: true
        description: "Las redes sin enlace no se muestran."
        fields:
          - name: network
            label: Red
            type: select
            options:
              values: [Instagram, Facebook, TikTok, X, YouTube]
          - { name: url, label: Enlace, type: string }
      - { name: availabilityNote, label: Aviso de disponibilidad, type: text }
      - name: seo
        label: SEO global
        type: object
        fields:
          - { name: siteUrl, label: Dominio del sitio, type: string, description: "Ejemplo: https://www.mipanaderia.com. Activa canonical y sitemap." }
          - { name: title, label: Título por defecto, type: string }
          - { name: description, label: Descripción por defecto, type: text }
          - { name: ogImage, label: Imagen para redes, type: image, options: { media: general } }
